
{{- $values := (tpl (.Values | toYaml) $) | fromYaml }}
{{- $values := (tpl ($values | toYaml) $) | fromYaml }}
---
apiVersion: ocular.crashoverride.run/v1beta1
kind: ClusterUploader
metadata:
  name: {{ include "chalkular.resourceName" (dict "suffix" "results" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  container:
    command:
    - /entrypoint
    env:
    - name: CHALKULAR_INGEST_TOKEN
      valueFrom:
        secretKeyRef:
          key: ingest-token
          name: {{ include "chalkular.resourceName" (dict "suffix" "secrets" "context" $) }}
          optional: true
    image: {{ $values.uploader.image.repository }}:{{ $values.uploader.image.tag }}
    imagePullPolicy: {{ $values.uploader.image.pullPolicy }}
    name: results-extract
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    volumeMounts: []
  parameters:
  - description: The S3 bucket to upload to
    name: S3_BUCKET
  - default: us-east-1
    description: AWS Region to use
    name: S3_REGION
  - default: ""
    description: |
      a prefix to append to all objects created (excluding content hash)
    name: S3_PREFIX
  - default: ""
    description: The workspace ID that the report belongs to
    name: WORKSPACE_ID
  - default: ""
    description: The action ID of the report
    name: ACTION_ID
  - default: ""
    description: The metadata ID of the resource scanned
    name: METADATA_ID
  - default: ""
    description: The host for the ingest, if empty upload is skipped
    name: INGEST_HOST
  - default: ""
    description: |
      Uses a content hash to determine when to ignore uploading duplicate data
      for result files. If set to non-empty string the uploader will,
      for each result file, look for a file with the same base name with
      ".contenthash" appended in the metadata folder. If found it will use the
      contents of that file as the hash and check if file already exists for
      that hash in the S3 bucket and not reupload if found. The path for the
      object will be <CONTENTHASH_PREFIX>/<HASH>/<FILE_BASE_NAME>
    name: ENABLE_CONTENTHASH
  - default: ""
    description: |
      The prefix to append to content hash files
    name: CONTENTHASH_PREFIX
  volumes: []
