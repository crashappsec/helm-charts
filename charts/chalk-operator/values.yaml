# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 2
  container:
    image:
      repository: ghcr.io/crashappsec/chalk-operator
      tag: v0.1.0
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    # Environment variables for chalk-operator configuration
    env: {}
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: chalk-operator-controller-manager
# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true
# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true
  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true
# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true
# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true
  # Name of the webhook configuration (used by operator to update CA bundle)
  configurationName: "chalk-operator-mutating-webhook-configuration"
  # Whether to exclude the operator's own namespace from webhook processing
  # When true (default), pods in the operator namespace will be ignored
  # When false, operator namespace pods will be processed like any other namespace
  excludeOperatorNamespace: false
# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false
# [CERT-MANAGER]: Enable cert-manager integration for webhook certificates
# When enabled, cert-manager Certificate and Issuer resources are created
# When disabled, self-signed certificates are generated via Helm hooks
certmanager:
  enable: false
# [CHALK-OPERATOR]: Chalk-specific configuration
chalk:
  # Cluster name to inject into pods (CHALK_K8S_CLUSTER_NAME environment variable)
  clusterName: "my-cluster"
# [PODMANIFEST]: HTTP endpoint exposing scrubbed pod specs to the pods
# themselves. The operator templates the per-pod URL into chalked pods as
# CHALK_K8S_PODMANIFEST_URL (the value already embeds the pod's own
# namespace and name via kubelet $(VAR) substitution), so a pod just curls
# $CHALK_K8S_PODMANIFEST_URL with its projected SA token.
podmanifest:
  enable: true
  # Port the operator listens on inside the container, also the Service port.
  # CHALK_K8S_PODMANIFEST_URL is templated as
  #   http://chalk-operator-podmanifest.<ns>.svc:<port>/v1/podmanifest/<ns>/<name>
  # where <ns>/<name> are resolved by the kubelet at container start.
  containerPort: 9000
# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false
