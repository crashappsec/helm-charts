{{- if .Values.podmanifest.enable }}
apiVersion: v1
kind: Service
metadata:
  name: chalk-operator-podmanifest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
    - name: podmanifest
      port: {{ .Values.podmanifest.containerPort }}
      targetPort: podmanifest
      protocol: TCP
{{- end }}
